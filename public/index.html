<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InterviewOS · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="dot"></span>
      <h1>InterviewOS</h1>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to manage your voice interviews.</p>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
      <div id="error" class="auth-error hidden"></div>
    </form>

  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script>
  // If already signed in, skip login.
  fetch('/api/me').then(r => r.json()).then(d => {
    if (d && d.username) {
      IOS.setSession({ username: d.username, signed_in_at: new Date().toISOString() });
      window.location.href = '/dashboard.html';
    }
  }).catch(() => {});

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');

  const btn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) {
      errorEl.textContent = 'Enter username and password.';
      errorEl.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    const timer = new AbortController();
    const t = setTimeout(() => timer.abort(), 25000);
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
        signal: timer.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Sign in failed (${res.status}).`);
      IOS.setSession({ username: data.username, signed_in_at: new Date().toISOString() });
      btn.innerHTML = 'Opening dashboard…';
      window.location.href = '/dashboard.html';
    } catch (err) {
      console.error('[login]', err);
      errorEl.textContent = err.name === 'AbortError' || err instanceof TypeError
        ? 'Could not reach the server. Check your internet and try again.'
        : err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    } finally {
      clearTimeout(t);
    }
  });
</script>
</body>
</html>
